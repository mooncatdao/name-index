name: Publish MoonCat naming index

on:
  repository_dispatch:
    types: [alchemy-naming-event]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  provisional:
    if: github.event_name == 'repository_dispatch'
    concurrency:
      group: mooncat-naming-provisional-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ingest provisional naming event
        env:
          PROVISIONAL_EVENT_JSON: ${{ toJson(github.event.client_payload) }}
        run: npm run ingest:provisional

      - name: Generate live naming artifacts
        run: npm run generate:live-naming-artifacts

      - name: Validate generated artifacts
        run: npm run check

      - name: Detect provisional artifact changes
        id: changes
        shell: bash
        run: |
          generated_paths=(
            data/pending-events.json
            data/current-names-live.json
            data/names-by-cat-id-live.json
            data/names-by-rescue-order-live.json
            data/names-simple-live.json
            data/metadata-live.json
          )
          if git diff --quiet -- "${generated_paths[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push provisional artifacts
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/pending-events.json \
            data/current-names-live.json \
            data/names-by-cat-id-live.json \
            data/names-by-rescue-order-live.json \
            data/names-simple-live.json \
            data/metadata-live.json
          if git diff --cached --quiet; then
            echo "No staged provisional changes."
            exit 0
          fi
          git commit -m "chore: publish provisional MoonCat naming event"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Unable to rebase provisional publication onto latest main."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Provisional push raced with another main update; retrying."
          done
          echo "Provisional publication push failed after retries."
          exit 1

      - name: Report no provisional change
        if: steps.changes.outputs.changed != 'true'
        run: echo "No provisional naming artifacts changed."

  reconcile:
    needs: provisional
    if: always() && (needs.provisional.result == 'success' || needs.provisional.result == 'skipped')
    concurrency:
      group: mooncat-naming-reconcile
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      CHECKPOINT_CACHE_KEY: mooncat-naming-checkpoint-${{ github.run_id }}
    steps:
      - name: Wait for finalized reconciliation window
        if: github.event_name == 'repository_dispatch'
        run: sleep 900

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Restore scanner checkpoint cache
        uses: actions/cache/restore@v5
        with:
          path: state/checkpoint.json
          key: ${{ env.CHECKPOINT_CACHE_KEY }}
          restore-keys: |
            mooncat-naming-checkpoint-

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan finalized naming events
        env:
          MOONCAT_RPC_URL: ${{ secrets.MOONCAT_RPC_URL }}
        run: npm run scan:save

      - name: Reconcile provisional naming events
        run: npm run reconcile:naming-events

      - name: Generate naming timeline
        run: npm run generate:naming-timeline

      - name: Validate generated artifacts
        run: npm run check

      - name: Detect generated artifact changes
        id: changes
        shell: bash
        run: |
          generated_paths=(
            data/events.jsonl
            data/current-names.json
            data/names-by-cat-id.json
            data/names-by-rescue-order.json
            data/metadata.json
            data/names-simple.json
            data/timeline-monthly.json
            data/pending-events.json
            data/current-names-live.json
            data/names-by-cat-id-live.json
            data/names-by-rescue-order-live.json
            data/names-simple-live.json
            data/metadata-live.json
          )
          if git diff --quiet -- "${generated_paths[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push reconciled artifacts
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/events.jsonl \
            data/current-names.json \
            data/names-by-cat-id.json \
            data/names-by-rescue-order.json \
            data/metadata.json \
            data/names-simple.json \
            data/timeline-monthly.json \
            data/pending-events.json \
            data/current-names-live.json \
            data/names-by-cat-id-live.json \
            data/names-by-rescue-order-live.json \
            data/names-simple-live.json \
            data/metadata-live.json
          if git diff --cached --quiet; then
            echo "No staged generated changes."
            exit 0
          fi
          git commit -m "chore: reconcile MoonCat naming events"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Unable to rebase reconciliation onto latest main."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Reconciliation push raced with another main update; retrying."
          done
          echo "Reconciliation push failed after retries."
          exit 1

      - name: Report no-change run
        if: steps.changes.outputs.changed != 'true'
        run: echo "No finalized or live naming artifacts changed."

      - name: Save scanner checkpoint cache
        uses: actions/cache/save@v5
        with:
          path: state/checkpoint.json
          key: ${{ env.CHECKPOINT_CACHE_KEY }}
