name: Publish MoonCat naming index

on:
  repository_dispatch:
    types: [alchemy-naming-event]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  provisional:
    if: github.event_name == 'repository_dispatch'
    concurrency:
      group: mooncat-naming-provisional-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Log provisional event summary
        if: github.event_name == 'repository_dispatch'
        env:
          EVENT_ID: ${{ github.event.client_payload.event.eventId }}
          TRANSACTION_HASH: ${{ github.event.client_payload.event.transactionHash }}
          BLOCK_NUMBER: ${{ github.event.client_payload.event.blockNumber }}
          LOG_INDEX: ${{ github.event.client_payload.event.logIndex }}
          TRANSACTION_INDEX: ${{ github.event.client_payload.event.transactionIndex }}
          CAT_ID: ${{ github.event.client_payload.event.catId }}
          REMOVED: ${{ github.event.client_payload.event.removed }}
          NAME_RAW: ${{ github.event.client_payload.event.nameRaw }}
        run: |
          node <<'NODE'
          const nameRaw = process.env.NAME_RAW ?? "";
          const summary = {
            eventId: process.env.EVENT_ID,
            transactionHash: process.env.TRANSACTION_HASH,
            blockNumber: process.env.BLOCK_NUMBER,
            logIndex: process.env.LOG_INDEX,
            catId: process.env.CAT_ID,
            removed: process.env.REMOVED,
            nameStatus: nameRaw === `0x${"0".repeat(64)}` ? "blank" : "nonblank"
          };
          if (process.env.TRANSACTION_INDEX !== "") {
            summary.transactionIndex = process.env.TRANSACTION_INDEX;
          }
          console.log("Provisional naming event summary:", JSON.stringify(summary));
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Ingest provisional naming event
        env:
          PROVISIONAL_EVENT_JSON: ${{ toJson(github.event.client_payload) }}
        run: npm run ingest:provisional

      - name: Generate live naming artifacts
        run: npm run generate:live-naming-artifacts

      - name: Generate recent namings feed
        run: npm run generate:recent-namings

      - name: Validate generated artifacts
        run: npm run check

      - name: Detect provisional artifact changes
        id: changes
        shell: bash
        run: |
          generated_paths=(
            data/pending-events.json
            data/current-names-live.json
            data/names-by-cat-id-live.json
            data/names-by-rescue-order-live.json
            data/names-simple-live.json
            data/metadata-live.json
            RECENT-NAMINGS.md
          )
          if git diff --quiet -- "${generated_paths[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push provisional artifacts
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/pending-events.json \
            data/current-names-live.json \
            data/names-by-cat-id-live.json \
            data/names-by-rescue-order-live.json \
            data/names-simple-live.json \
            data/metadata-live.json \
            RECENT-NAMINGS.md
          if git diff --cached --quiet; then
            echo "No staged provisional changes."
            exit 0
          fi
          git commit -m "chore: publish provisional MoonCat naming event"
          for attempt in 1 2 3; do
            git fetch origin main
            # Equivalent to git rebase origin/main with expected checkpoint changes autostashed.
            if ! git rebase --autostash origin/main; then
              git rebase --abort || true
              echo "Unable to rebase provisional publication onto latest main."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Provisional push raced with another main update; retrying."
          done
          echo "Provisional publication push failed after retries."
          exit 1

      - name: Report no provisional change
        if: steps.changes.outputs.changed != 'true'
        run: echo "No provisional naming artifacts changed."

  reconcile:
    needs: provisional
    if: always() && (needs.provisional.result == 'success' || needs.provisional.result == 'skipped')
    concurrency:
      group: mooncat-naming-reconcile
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      CHECKPOINT_CACHE_KEY: mooncat-naming-checkpoint-${{ github.run_id }}
    steps:
      - name: Wait for finalized reconciliation window
        if: github.event_name == 'repository_dispatch'
        run: sleep 900

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Restore scanner checkpoint cache
        uses: actions/cache/restore@v5
        with:
          path: state/checkpoint.json
          key: ${{ env.CHECKPOINT_CACHE_KEY }}
          restore-keys: |
            mooncat-naming-checkpoint-

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Scan finalized naming events
        env:
          MOONCAT_RPC_URL: ${{ secrets.MOONCAT_RPC_URL }}
        run: npm run scan:save

      - name: Reconcile provisional naming events
        run: npm run reconcile:naming-events

      - name: Generate recent namings feed
        run: npm run generate:recent-namings

      - name: Generate seed comparison
        run: npm run compare:seed

      - name: Generate naming timeline
        run: npm run generate:naming-timeline

      - name: Render naming timeline image
        run: npm run render:timeline-image

      - name: Validate generated artifacts
        run: npm run check

      - name: Detect generated artifact changes
        id: changes
        shell: bash
        run: |
          generated_paths=(
            data/events.jsonl
            data/current-names.json
            data/names-by-cat-id.json
            data/names-by-rescue-order.json
            data/metadata.json
            data/names-simple.json
            data/timeline-monthly.json
            docs/images/naming-timeline.png
            reports/seed-comparison.json
            data/pending-events.json
            data/current-names-live.json
            data/names-by-cat-id-live.json
            data/names-by-rescue-order-live.json
            data/names-simple-live.json
            data/metadata-live.json
            RECENT-NAMINGS.md
          )
          if git diff --quiet -- "${generated_paths[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push reconciled artifacts
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/events.jsonl \
            data/current-names.json \
            data/names-by-cat-id.json \
            data/names-by-rescue-order.json \
            data/metadata.json \
            data/names-simple.json \
            data/timeline-monthly.json \
            docs/images/naming-timeline.png \
            reports/seed-comparison.json \
            data/pending-events.json \
            data/current-names-live.json \
            data/names-by-cat-id-live.json \
            data/names-by-rescue-order-live.json \
            data/names-simple-live.json \
            data/metadata-live.json \
            RECENT-NAMINGS.md
          if git diff --cached --quiet; then
            echo "No staged generated changes."
            exit 0
          fi
          git commit -m "chore: reconcile MoonCat naming events"
          for attempt in 1 2 3; do
            git fetch origin main
            # Equivalent to git rebase origin/main with expected checkpoint changes autostashed.
            if ! git rebase --autostash origin/main; then
              git rebase --abort || true
              echo "Unable to rebase reconciliation onto latest main."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Reconciliation push raced with another main update; retrying."
          done
          echo "Reconciliation push failed after retries."
          exit 1

      # CATMOON_DISPATCH_TOKEN must be a narrowly scoped token for the CatMoon repository.
      - name: Notify CatMoon of updated naming artifacts
        if: steps.changes.outputs.changed == 'true'
        env:
          CATMOON_DISPATCH_TOKEN: ${{ secrets.CATMOON_DISPATCH_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url https://api.github.com/repos/zibzub/catmoon/dispatches \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${CATMOON_DISPATCH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data '{"event_type":"mooncat-names-updated"}'

      - name: Report no-change run
        if: steps.changes.outputs.changed != 'true'
        run: echo "No finalized or live naming artifacts changed."

      - name: Save scanner checkpoint cache
        uses: actions/cache/save@v5
        with:
          path: state/checkpoint.json
          key: ${{ env.CHECKPOINT_CACHE_KEY }}
